name: 鸭口选股 V5 - 自动更新

on:
  schedule:
    # 周一至周五 北京时间 20:00（UTC 12:00）运行
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    # V5 策略：筛选 V1 和 V4 重合的股票
    timeout-minutes: 360

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 等待 V1 和 V4 数据更新
        run: |
          echo "检查 V1 和 V4 数据是否为今天更新..."
          
          TODAY=$(date -u +%Y-%m-%d)
          echo "今天是 UTC 日期: $TODAY"
          
          MAX_RETRIES=60
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            V1_UPDATED=false
            V4_UPDATED=false
            
            # 检查 V1 数据
            echo "[$RETRY_COUNT] 检查 V1 数据..."
            V1_DATA=$(curl -s "https://jesse-j-whu.github.io/stock-picker/data.json" 2>/dev/null)
            if [ -n "$V1_DATA" ]; then
              V1_TIME=$(echo "$V1_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin).get('update_time', '')[:10])" 2>/dev/null)
              echo "  V1 更新时间: $V1_TIME"
              if [ "$V1_TIME" = "$TODAY" ]; then
                V1_UPDATED=true
                echo "  ✓ V1 数据已更新"
              fi
            fi
            
            # 检查 V4 数据
            echo "[$RETRY_COUNT] 检查 V4 数据..."
            V4_DATA=$(curl -s "https://jesse-j-whu.github.io/stock-picker-v4/data.json" 2>/dev/null)
            if [ -n "$V4_DATA" ]; then
              V4_TIME=$(echo "$V4_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin).get('update_time', '')[:10])" 2>/dev/null)
              echo "  V4 更新时间: $V4_TIME"
              if [ "$V4_TIME" = "$TODAY" ]; then
                V4_UPDATED=true
                echo "  ✓ V4 数据已更新"
              fi
            fi
            
            # 检查是否都更新
            if [ "$V1_UPDATED" = "true" ] && [ "$V4_UPDATED" = "true" ]; then
              echo ""
              echo "=========================================="
              echo "✓ V1 和 V4 数据都已更新为今天，开始执行 V5 选股"
              echo "=========================================="
              echo ""
              exit 0
            fi
            
            # 未更新，继续等待
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "  数据未更新，等待 2 分钟后重试..."
              echo ""
              sleep 120
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "⚠ 警告：等待超时，V1 或 V4 数据未更新"
          echo "=========================================="
          echo ""
          # 即使超时也继续运行，使用旧数据

      - name: 运行选股策略
        run: python strategy.py

      - name: 提交结果到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动更新 V5 选股结果 $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main || true
            git push --force-with-lease
          fi

  deploy:
    needs: run-strategy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出主分支代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传 docs/ 为 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
